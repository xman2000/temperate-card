blueprint:
  name: Temperate changeover
  description: >-
    Switches a heat/cool thermostat between Heat and Cool from one comfort range.
    Home Assistant owns the range: "heat below" and "cool above" live in two
    input_numbers and are copied to the thermostat's heat and cool setpoints.
    Two booleans allow or block each mode. If the thermostat's mode or setpoints
    move away from what this automation asked for (someone used the thermostat
    itself), the manual override turns on and the automation leaves it alone
    until the override is turned off, which also puts the range back.
    Pairs with the Temperate card (custom:temperate-card).
  domain: automation
  input:
    thermostat:
      name: Thermostat
      selector:
        entity:
          filter:
            - domain: climate
    heat_allowed:
      name: Heat allowed
      selector:
        entity:
          filter:
            - domain: input_boolean
    cool_allowed:
      name: Cool allowed
      selector:
        entity:
          filter:
            - domain: input_boolean
    manual_override:
      name: Manual override
      selector:
        entity:
          filter:
            - domain: input_boolean
    heat_below:
      name: Heat below
      description: Heat comes on when the room drops below this.
      selector:
        entity:
          filter:
            - domain: input_number
    cool_above:
      name: Cool above
      description: Cooling comes on when the room rises above this.
      selector:
        entity:
          filter:
            - domain: input_number
    commanded_mode:
      name: Commanded mode
      description: Remembers the last mode this automation set.
      selector:
        entity:
          filter:
            - domain: input_text
    settle_time:
      name: Settle time
      description: How long a difference must last before it counts as a change on the thermostat.
      default: 20
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds
    schedule:
      name: Schedule (optional)
      description: >-
        A schedule helper edited on the card's Schedule tab. Each period writes
        its range to Heat below and Cool above, or turns the thermostat off.
      default: []
      selector:
        entity:
          filter:
            - domain: schedule
    follow_schedule:
      name: Follow schedule (optional)
      description: A toggle that pauses the schedule when off. Leave empty to always follow it.
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean

mode: queued
max: 25

variables:
  thermostat: !input thermostat
  heat_allowed: !input heat_allowed
  cool_allowed: !input cool_allowed
  manual_override: !input manual_override
  heat_below: !input heat_below
  cool_above: !input cool_above
  commanded_mode: !input commanded_mode
  settle_time: !input settle_time
  schedule_entity: !input schedule
  follow_entity: !input follow_schedule
  # Wide enough for a thermostat that rounds to 0.5 °C while Home Assistant is in °F.
  tolerance: 0.5

triggers:
  - trigger: state
    entity_id: !input thermostat
    attribute: current_temperature
    id: temperature
  - trigger: state
    entity_id:
      - !input heat_allowed
      - !input cool_allowed
      - !input heat_below
      - !input cool_above
    id: evaluate
  - trigger: state
    entity_id: !input thermostat
    attribute: target_temp_low
    id: setpoint
  - trigger: state
    entity_id: !input thermostat
    attribute: target_temp_high
    id: setpoint
  - trigger: state
    entity_id: !input thermostat
    to: ~
    id: mode
  - trigger: state
    entity_id: !input manual_override
    from: "on"
    to: "off"
    id: resume
  - trigger: state
    entity_id: !input schedule
    id: period
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    minutes: /5
    id: evaluate

actions:
  # Did the thermostat drift from what we asked for? Give a slow confirmation
  # time to arrive before calling it a change made on the thermostat.
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['setpoint', 'mode']
             and trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown']
             and trigger.to_state.state not in ['unavailable', 'unknown']
             and is_state(manual_override, 'off') }}
    then:
      - wait_template: >-
          {% set l = state_attr(thermostat, 'target_temp_low') %}{% set h = state_attr(thermostat, 'target_temp_high') %}
          {{ (states(thermostat) == states(commanded_mode) or states(commanded_mode) in ['', 'unknown'])
             and (l is none or (l | float(0) - states(heat_below) | float(0)) | abs < tolerance)
             and (h is none or (h | float(0) - states(cool_above) | float(0)) | abs < tolerance) }}
        timeout:
          seconds: "{{ settle_time }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed and is_state(manual_override, 'off') }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: !input manual_override
          - stop: Changed on the thermostat, manual override is on

  # A new period sets the range, even during a manual override, so Back to auto
  # restores the current period. A range changed by hand holds until the next one.
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['period', 'startup']
             and schedule_entity | length > 0
             and is_state(schedule_entity, 'on')
             and (follow_entity | length == 0 or is_state(follow_entity, 'on'))
             and state_attr(schedule_entity, 'heat_below') is number
             and state_attr(schedule_entity, 'cool_above') is number }}
    then:
      - action: input_number.set_value
        continue_on_error: true
        target:
          entity_id: !input heat_below
        data:
          value: "{{ state_attr(schedule_entity, 'heat_below') }}"
      - action: input_number.set_value
        continue_on_error: true
        target:
          entity_id: !input cool_above
        data:
          value: "{{ state_attr(schedule_entity, 'cool_above') }}"

  - condition: state
    entity_id: !input manual_override
    state: "off"

  # One report can carry a new room temperature and a change made on the thermostat.
  # Leave a mismatch to the run queued behind this one, which can tell them apart.
  - condition: template
    value_template: >-
      {% if trigger.id != 'temperature' %}true{% else %}
      {% set l = state_attr(thermostat, 'target_temp_low') %}{% set h = state_attr(thermostat, 'target_temp_high') %}
      {{ (states(thermostat) == states(commanded_mode) or states(commanded_mode) in ['', 'unknown'])
         and (l is none or (l | float(0) - states(heat_below) | float(0)) | abs < tolerance)
         and (h is none or (h | float(0) - states(cool_above) | float(0)) | abs < tolerance) }}
      {% endif %}

  - variables:
      mode_now: "{{ states(thermostat) }}"
      cur: "{{ state_attr(thermostat, 'current_temperature') }}"
      low: "{{ states(heat_below) | float(0) }}"
      high: "{{ states(cool_above) | float(0) }}"
      heat_ok: "{{ is_state(heat_allowed, 'on') }}"
      cool_ok: "{{ is_state(cool_allowed, 'on') }}"
      # Separate from the allow toggles, so a seasonal block survives an Off period.
      scheduled_off: >-
        {{ schedule_entity | length > 0
           and is_state(schedule_entity, 'on')
           and (follow_entity | length == 0 or is_state(follow_entity, 'on'))
           and state_attr(schedule_entity, 'off') == true }}
      desired: >-
        {% if cur is none or low <= 0 or high <= 0 %}{{ mode_now }}
        {% elif scheduled_off or (not heat_ok and not cool_ok) %}off
        {% elif cur | float < low and heat_ok %}heat
        {% elif cur | float > high and cool_ok %}cool
        {% elif mode_now == 'heat' and heat_ok %}heat
        {% elif mode_now == 'cool' and cool_ok %}cool
        {% elif heat_ok %}heat
        {% else %}cool{% endif %}

  - condition: template
    value_template: >-
      {{ (mode_now in ['off', 'heat', 'cool', 'emergency_heating']
          or (trigger.id == 'resume' and mode_now not in ['unavailable', 'unknown']))
         and low > 0 and high > 0 }}

  # Keep the thermostat's setpoints equal to the range.
  - if:
      - condition: template
        value_template: >-
          {% set l = state_attr(thermostat, 'target_temp_low') %}{% set h = state_attr(thermostat, 'target_temp_high') %}
          {{ l is not none and h is not none
             and ((l | float(0) - low) | abs >= tolerance or (h | float(0) - high) | abs >= tolerance) }}
    then:
      - action: climate.set_temperature
        continue_on_error: true
        target:
          entity_id: !input thermostat
        data:
          target_temp_low: "{{ low }}"
          target_temp_high: "{{ high }}"
      - wait_template: >-
          {{ (state_attr(thermostat, 'target_temp_low') | float(0) - low) | abs < tolerance
             and (state_attr(thermostat, 'target_temp_high') | float(0) - high) | abs < tolerance }}
        timeout:
          seconds: "{{ settle_time }}"
        continue_on_timeout: true

  # Remember what we want before asking for it, so the confirmation is expected.
  - if:
      - condition: template
        value_template: "{{ states(commanded_mode) != desired }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input commanded_mode
        data:
          value: "{{ desired }}"

  - if:
      - condition: template
        value_template: "{{ desired != mode_now }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input thermostat
        data:
          hvac_mode: "{{ desired }}"
      - wait_template: "{{ is_state(thermostat, desired) }}"
        timeout:
          seconds: "{{ settle_time }}"
        continue_on_timeout: true
